<div class="card h-100 product-card shadow-sm">
  <div class="image-container">
    <img [src]="miProducto.image" [alt]="miProducto.name" class="card-img-top product-image" />
  </div>

  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-2 mb-2">
      <span class="badge text-bg-secondary text-uppercase">{{ miProducto.category }}</span>

      @if (miProducto.active) {
        <span class="badge text-bg-success">Activo</span>
      } @else {
        <span class="badge text-bg-danger">Inactivo</span>
      }
    </div>

    <h5 class="card-title">{{ miProducto.name }}</h5>
    <p class="card-text text-secondary flex-grow-1">{{ miProducto.description }}</p>

    <div class="d-flex justify-content-between align-items-center mt-3">
      <strong class="price">{{ miProducto.price }} €</strong>
      <button class="btn btn-outline-danger btn-sm" type="button" (click)="deleteProduct()">
        Eliminar producto
      </button>
    </div>
  </div>
  <div class="image-container"></div>
</div>
