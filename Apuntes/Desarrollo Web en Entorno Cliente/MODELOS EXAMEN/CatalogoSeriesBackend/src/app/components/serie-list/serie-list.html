<section>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <div>
            <h2 class="h3 mb-1">Series obtenidas mediante fetch</h2>
            <p class="text-muted mb-0">Elementos actuales: {{ seriesArray.length }}</p>
        </div>

        <button class="btn btn-primary" (click)="recargarDesdeApi()" [disabled]="estaCargando()">
            Recargar desde API
        </button>
    </div>

    @if (estaCargando()) {
        <div class="alert alert-info">
            Cargando datos del backend...
        </div>
    }

    @if (getError() !== "") {
        <div class="alert alert-danger">
            <strong>Error:</strong> {{ getError() }}
        </div>
    }

    <div class="row g-4">
        @for (serie of seriesArray; track serie.id) {
            <article class="col-12 col-md-6 col-xl-4">
                <app-serie-card [miSerie]="serie"></app-serie-card>
            </article>
        } @empty {
            @if (!estaCargando()) {
                <div class="col-12">
                    <div class="alert alert-warning mb-0">
                        No hay series para mostrar.
                    </div>
                </div>
            }
        }
    </div>
</section>
