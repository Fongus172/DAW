<div class="card h-100 shadow-sm">
    <img [src]="serie.image" [alt]="serie.title" class="card-img-top serie-img" />

    <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ serie.title }}</h5>
        <p class="mb-1"><strong>Creador:</strong> {{ serie.creator }}</p>
        <p class="mb-1"><strong>Canal:</strong> {{ serie.channel }}</p>

        @if (serie.rating >= 8) {
            <span class="badge text-bg-success mb-3">Valoración: {{ serie.rating }}/10</span>
        } @else if (serie.rating >= 5) {
            <span class="badge text-bg-warning mb-3">Valoración: {{ serie.rating }}/10</span>
        } @else {
            <span class="badge text-bg-danger mb-3">Valoración: {{ serie.rating }}/10</span>
        }

        <button class="btn btn-primary mt-auto" (click)="seleccionarSerie()">
            Reservar proyección
        </button>
    </div>
</div>
