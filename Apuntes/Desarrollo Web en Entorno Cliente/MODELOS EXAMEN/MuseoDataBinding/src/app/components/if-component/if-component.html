<section>
    <h2>2. Control Flow con &#64;if</h2>

    <div class="card p-4">
        <label for="edadAcceso" class="form-label">Edad del visitante</label>
        <input
            type="number"
            id="edadAcceso"
            class="form-control mb-3"
            (input)="cambiarEdad($event)"
        />

        <!-- Angular evalúa las condiciones de arriba hacia abajo. -->
        @if (edad >= 0 && edad < 18) {
            <div class="alert alert-warning">Puedes entrar al museo, pero no a la exposición para adultos.</div>
        } @else if (edad >= 18 && edad <= 120) {
            <div class="alert alert-success">Puedes acceder a todas las exposiciones.</div>
        } @else {
            <div class="alert alert-danger">El valor de edad no es correcto.</div>
        }
    </div>
</section>
